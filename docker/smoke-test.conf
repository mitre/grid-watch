# Settings for docker/smoke-test.sh.

SIM_NAME="Grid Watch"

# Compose profiles to start along with the default services.
PROFILES=""

# Fact source shipped in docs/sources/. SOURCE_FACTS are copied from it.
FACTS_ID="b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e"

# One target per protocol. Each runs ABILITY (its exact Caldera name) against
# the PLC in compose service SERVICE, with SOURCE_FACTS copied from the fact
# source and FACTS (trait=value) added. PORT is the PLC's TCP port, probed from
# the host (empty for UDP). The read worked if its output matches EXPECT.
TARGETS="dnp3"

target_dnp3() {
    SERVICE="plc"
    PORT="20000"
    ABILITY="DNP3 (TCP) - Integrity Poll"
    SOURCE_FACTS="dnp3.server.ip dnp3.local.link dnp3.remote.link"
    FACTS=""
    EXPECT="Group[0-9]+Var[0-9]+"
}
